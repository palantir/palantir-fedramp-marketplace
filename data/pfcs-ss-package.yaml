$schema: https://fedramp.gov/schemas/fedramp-certification-package-overview-schema-2026-06-24.json
metadata:
  responsibleAccountableOfficial:
    name: PFCS-SS ISSO
    title: Information System Security Officer
    email: FedRAMP-ISSO@palantir.com
  version: 1.0.0
  sourceOfUpdate: https://github.com/palantir/palantir-fedramp-marketplace
serviceIdentification:
  providerName: Palantir Technologies
  serviceName: Palantir Federal Cloud Service – Supporting Services (PFCS-SS)
  serviceAcronym: PFCS-SS
  serviceDescription: PFCS-SS is a dedicated environment for the purpose of delivering best-of-breed commercial software to federal government customers as a secure cloud service at the FedRAMP High baseline. The software deployed to PFCS-SS is commercially available software configured to run on PFCS' Kubernetes infrastructure and leverage PFCS' management plane services.
  certificationType: Rev5
  fedRampPackageId: FR2315464863
  website: https://www.palantir.com/offerings/fedstart/
  logo: https://raw.githubusercontent.com/palantir/conjure/master/docs/media/palantir-logo.svg
serviceProperties:
  serviceType:
    - SaaS
  deploymentModel: Public Cloud
  trustCenter:
    repositoryType:
      - Trust Center
    url: https://pfcsdocs.palantirgov.com/
    repositoryDescription: PFCS Documentation Repository. Access is restricted to verified federal government accounts and to FedRAMP Recognized independent assessment services supporting an assessment of this offering.
    authenticationRequired: true
    accessRequestInstructions: Federal agencies and FedRAMP Recognized independent assessment services request access by contacting FedRAMP-ISSO@palantir.com with the requesting organization, the point of contact to be provisioned, and the authorization or assessment activity the access supports. Access persists for the duration of that activity.
  secureConfigurationGuidance:
    repositoryType:
      - Secure Configuration Guidance
    url: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.f8620325-fdb5-4b5e-843a-b53ce10db2ba
    repositoryDescription: Recommended Secure Configuration overview for PFCS-SS, indexing the per-application Security Admin Guide locations. Most partner guides are published publicly without authentication and are linked from each entry in certifiedServices; a small number remain gated at the partner's preference.
    authenticationRequired: true
    accessRequestInstructions: Request access via FedRAMP-ISSO@palantir.com. Publicly published per-application Security Admin Guides require no authentication.
  ongoingCertificationReportFeedbackUrl: mailto:FedRAMP-ISSO@palantir.com?subject=PFCS-SS%20Ongoing%20Certification%20Report%20feedback
  ongoingCertificationReportFeedbackInstructions: Send feedback or questions about any Ongoing Certification Report by email to FedRAMP-ISSO@palantir.com. Questions and answers are published, anonymized and desensitized, in the Feedback Summary of a subsequent report.
  nextQuarterlyReview:
    registrationUrl: mailto:FedRAMP-ISSO@palantir.com?subject=PFCS-SS%20Quarterly%20Review%20registration
    registrationInstructions: Request an invitation by email to FedRAMP-ISSO@palantir.com.
    date: "2026-10-27"
    startTime: 13:00:00-04:00
  nextOngoingCertificationReportDate: "2026-10-20"
  businessCategory:
    - Analytics
    - Collaboration
    - Cybersecurity & Risk Management
    - Data Management
    - Development Tools
    - Finance
    - Fleet Management
    - Law Enforcement
    - Operations Management
    - Research
  ongoingCertificationReportSchedule:
    - "2026-10-20"
    - "2027-01-19"
    - "2027-04-20"
    - "2027-07-20"
contactInformation:
  - contactType: Security
    contactName: FedRAMP ISSO
    contactEmail: fedramp-isso@palantir.com
  - contactType: Sales
    contactName: Palantir FedStart
    contactEmail: PFCS-SS@palantir.com
assessor:
  name: Schellman Compliance, LLC
  assessorID: "136571"
certifiedServices:
  - serviceName: Authifi
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: Authifi is an Authorization Management solution designed to help government and highly regulated organizations secure access to their most sensitive applications and data. Engineered from the ground up for healthcare, medical research and biopharma environments, Authifi includes identity and access management (IAM), ensuring that the right users get the right access, at the right time, for the right reasons—while automatically enforcing compliance with federal and industry cybersecurity standards.
    dateAvailable: "2025-07-25"
    securityCategory: High
    providerWebsite: https://axleinfo.com/
    securityAdminGuideUrl: https://authifi.pages.dev/security/recommended-secure-configuration/
    includedInMinimumAssessmentScope: true
  - serviceName: AutogenAI Federal
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: AutogenAI is a Generative AI proposal management platform that supports capture through submission by automating research and sourcing, pWin go/no-go, requirement shredding and first-draft generation, reviewer workflows and compliance checks, and templated, auditable outputs for on-time, high-quality submissions.
    dateAvailable: "2025-12-19"
    securityCategory: High
    providerWebsite: https://www.autogenai.com/
    securityAdminGuideUrl: https://trust.autogenai.com/?itemUid=672cf6e9-f36e-46d6-b84b-3b22abf40471&source=click
    includedInMinimumAssessmentScope: true
  - serviceName: Claude for Government (C4G)
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: C4G is Anthropic's AI chat assistant designed for highly regulated environments. Purpose-built to meet FedRAMP High security controls, it delivers Claude's advanced reasoning capabilities with enhanced security, administrative controls, and expanded context windows. Claude for Government seamlessly integrates into existing workflows while maintaining the data protection and compliance standards required for critical business processes in government agencies and other security-conscious organizations.
    dateAvailable: "2025-05-12"
    securityCategory: High
    providerWebsite: https://www.anthropic.com/
    securityAdminGuideUrl: https://support.claude.com/en/articles/9267276-roles-and-permissions
    includedInMinimumAssessmentScope: true
  - serviceName: Cognition
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: Cognition provides a suite of AI coding tools to accelerate developer productivity, including Cognition Plugins for popular IDEs as well as its own AI-native IDE, Devin Desktop. Cognition leverages state-of-the-art AI models and advanced context-awareness capabilities to deliver tools like fast autocomplete, codebase-aware Chat, and agentic coding capabilities. Enterprise developer teams rely on Cognition to increase developer velocity, reduce onboarding times, and reduce tech debt. Cognition was previously known as Windsurf and Codeium.
    dateAvailable: "2024-12-18"
    securityCategory: High
    providerWebsite: https://cognition.com/
    securityAdminGuideUrl: https://docs.devin.ai/desktop/security/security-admin-guide
    includedInMinimumAssessmentScope: true
  - serviceName: ConductorAI Conduit Platform
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: Ingests policy documents, prior approvals, and heuristics to orchestrate document review and approvals within the DOD, USG, IC, and other highly regulated entities. By atomizing policy statements into AI-enabled agents, rules, workflow steps, and document edits, the platform enables teams to accelerate and automate complex policy approvals. The software is data-agnostic, model-independent, and can be adapted to deploy into various customer environments, including classified settings.
    dateAvailable: "2025-07-25"
    securityCategory: High
    providerWebsite: https://www.conductorai.co/
    securityAdminGuideUrl: http://www.conductorai.co/security-administration-guide
    includedInMinimumAssessmentScope: true
  - serviceName: Descope
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: Descope is a drag-and-drop platform to help organizations manage all their external identities. The no-code/low-code solution helps organizations create, modify, and secure authentication and authorization journeys for end users, business customers, partner applications, and APIs and AI agents.
    dateAvailable: "2025-03-03"
    securityCategory: High
    providerWebsite: https://www.descope.com/
    securityAdminGuideUrl: https://docs.descope.com/fedramp-security-admin-guide
    includedInMinimumAssessmentScope: true
  - serviceName: Epsilon3
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: Epsilon3 is software for complex engineering, assembly, manufacturing, testing, and operations. Its solutions for advanced process control support planning, tracking, and analyzing a wide range of complex operations and procedures from manufacturing and testing through operations and maintenance.
    dateAvailable: "2025-03-03"
    securityCategory: High
    providerWebsite: https://www.epsilon3.io/
    securityAdminGuideUrl: https://support.epsilon3.io/en/articles/13198554-epsilon3-security-administration-guide
    includedInMinimumAssessmentScope: true
  - serviceName: GovSignals
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: GovSignals.ai is an AI-driven platform designed to deliver real-time government intelligence and analytics from federal agencies and public records. Leveraging advanced generative and agentic AI, the platform identifies emerging trends, monitors policy shifts, and anticipates agency actions across federal and SLED procurement markets. For government contractors, GovSignals.ai automates the end-to-end proposal creation process. For government agencies, GovSignals streamlines acquisition operations by providing intelligent intake, evaluation screening, and project management tools powered by AI.
    dateAvailable: "2025-07-25"
    securityCategory: High
    providerWebsite: https://www.govsignals.ai/
    securityAdminGuideUrl: https://www.govsignals.ai/legal/security-admin-guide
    includedInMinimumAssessmentScope: true
  - serviceName: Grafana Federal Cloud
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: A fully managed, highly scalable observability platform, powered by Grafana Mimir for Prometheus metrics, Grafana Loki for logs, Grafana Tempo for traces, and Grafana, the de facto standard for data visualization.
    dateAvailable: "2024-12-18"
    securityCategory: High
    providerWebsite: https://grafana.com/
    securityAdminGuideUrl: https://grafana.com/docs/federal-cloud/security-and-account-management/
    includedInMinimumAssessmentScope: true
  - serviceName: Hyperscience Hypercell
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: An AI platform with a proprietary model-based architecture that reads and understands all forms of content with 99% accuracy and 98.5% automation, scaling across the enterprise while ensuring auditability, governance, and security using private enterprise data.
    dateAvailable: "2024-11-25"
    securityCategory: High
    providerWebsite: https://www.hyperscience.com/
    securityAdminGuideUrl: https://help.hyperscience.ai/deployment/docs/fedramp-security-admin-guide
    includedInMinimumAssessmentScope: true
  - serviceName: KODE OS for Government
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: KODE OS is a FedRAMP High authorized, cloud-native building operations platform deployed within the Palantir FedStart environment that enables federal, state, local, and government contractor organizations to securely centralize, monitor, control, and optimize distributed facility infrastructure through unified data integration, real-time analytics, role-based access control, and automated operational workflows.
    dateAvailable: "2026-02-10"
    securityCategory: High
    providerWebsite: https://www.kodelabs.com/
    securityAdminGuideUrl: https://pfcsdocs.palantirgov.com/workspace/preview-app/ri.blobster.main.pdf.5d06dceb-5fea-466f-b01b-098d88171255
    includedInMinimumAssessmentScope: true
  - serviceName: Knightscope Security Operations Center (KSOC)
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: The Knightscope Security Operations Center (KSOC) is a user interface for law enforcement, security professionals, and remote monitoring teams to interact with autonomous systems utilized in physical security operations. The platform delivers both real-time visibility and investigative tools to help teams respond faster, reduce cost, and improve public safety.
    dateAvailable: "2025-12-19"
    securityCategory: High
    providerWebsite: https://www.knightscope.com/
    securityAdminGuideUrl: https://pfcsdocs.palantirgov.com/
    includedInMinimumAssessmentScope: true
  - serviceName: Legion
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: Legion is a secure, modular agent orchestration platform that unifies mission data and workflows, deployable across classified, air-gapped, and edge environments.
    dateAvailable: "2025-12-19"
    securityCategory: High
    providerWebsite: https://legionintel.com/
    securityAdminGuideUrl: https://trust.legionintel.com
    includedInMinimumAssessmentScope: true
  - serviceName: Method Platform
    serviceDescription: The Method Platform is composed of integrations (cloud, endpoint, identity/directory services, and vulnerability scanners), tools (network, vulnerability, web, OSINT scanning, and validation), guardrails (operator-in-the-loop and on-the-loop breakpoints and approval workflows for AI-generated plans), data management (transforming raw tool and integration data into linked knowledge across a cyber ontology), and AI agents (to recommend work or execute tasks end-to-end). Together, these capabilities enable autonomous or semi-autonomous cyber operations across on-premises, cloud, and edge environments.
    securityCategory: High
    includedInMinimumAssessmentScope: true
    providerWebsite: https://www.method.security/
    securityAdminGuideUrl: https://docs.method.security/platform/security-governance/security-administration-guide
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
  - serviceName: Oligo Runtime Security Platform
    serviceDescription: 'Oligo delivers runtime security for modern applications, cloud workloads, and AI systems. By analyzing application and infrastructure behavior in production, Oligo reveals what is actually running, identifies which vulnerabilities are truly exploitable, and detects malicious activity as it happens. Unlike traditional security tools that rely on static scanning or passive visibility, Oligo focuses on runtime behavior to detect real attacks and surgically block them at the first exploit attempt. This precision helps security teams cut through alert noise, protect critical systems from both known and unknown threats, and focus on the signals that matter most: what happens at runtime.'
    securityCategory: High
    includedInMinimumAssessmentScope: true
    providerWebsite: https://www.oligo.security/
    securityAdminGuideUrl: https://oligocybersecurity.github.io/security-admin-guide/
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
  - serviceName: Picogrid Legion
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: Legion is a cloud-native software built to provide platform-agnostic infrastructure for command and control capabilities.
    dateAvailable: "2025-12-19"
    securityCategory: High
    providerWebsite: https://www.picogrid.com/
    securityAdminGuideUrl: https://docs.picogrid.com/update/reference/admins-guide
    includedInMinimumAssessmentScope: true
  - serviceName: Pryzm
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: Pryzm is an AI-powered market-intelligence and relationship-management platform specifically designed for the national-security ecosystem, offering capabilities like opportunity search, budget intelligence, and contextual CRM. The platform streamlines financial, contract, and project management.
    dateAvailable: "2025-07-25"
    securityCategory: High
    providerWebsite: https://www.pryzm.io/
    securityAdminGuideUrl: https://www.pryzm.io/legal/security-admin-guide-page-pryzm
    includedInMinimumAssessmentScope: true
  - serviceName: Skydio Federal Cloud
    serviceDescription: Skydio Federal Cloud is a software-as-a-service application used to manage and conduct unmanned aircraft operations. The system provides capabilities to organize users and roles, register and manage drones, and configure operational settings for flight activities. Operators use the system to plan and initiate drone flights, monitor flight status, view live and recorded video, and capture and review flight-associated data products. The system also provides historical records and audit-relevant information associated with user activity, device activity, and flight execution.
    securityCategory: High
    includedInMinimumAssessmentScope: true
    providerWebsite: https://www.skydio.com/
    securityAdminGuideUrl: https://support.skydio.com/hc/en-us/articles/4402745186971-Getting-started-with-Skydio-Cloud
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
  - serviceName: SmartPM
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: SmartPM is a cloud-native schedule analytics and risk intelligence platform purpose-built for the construction industry. It ingests raw scheduling data (.xer, .mpp, .xml, .ppx, .pp) and applies critical path method (CPM) logic, delay analysis frameworks, and earned value methodologies to surface risks, measure progress, and automate forensic-level oversight. SmartPM supports international standards in scheduling and delay analysis, offering defensible insights for audit, compliance, and performance monitoring of capital projects.
    dateAvailable: "2025-07-25"
    securityCategory: High
    providerWebsite: https://www.smartpm.com/
    securityAdminGuideUrl: https://help.smartpm.com/authentication
    includedInMinimumAssessmentScope: true
  - serviceName: SpecterOps BloodHound Enterprise
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: See your organization from the attacker's view. BloodHound Enterprise is an Attack Path Management solution that continuously maps and quantifies identity Attack Paths in Active Directory and Azure.
    dateAvailable: "2024-01-08"
    securityCategory: High
    providerWebsite: https://specterops.io/
    securityAdminGuideUrl: https://bloodhound.specterops.io/manage-bloodhound/auth/users-and-roles
    includedInMinimumAssessmentScope: true
  - serviceName: Streamline
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: Streamline is the first third-party product deployable through Palantir Foundry, offering secure, offline-capable mobile data collection integrated with Foundry's infrastructure and ontology, enabling non-technical users to easily create and manage authenticated or public data intake tools.
    dateAvailable: "2025-12-19"
    securityCategory: High
    providerWebsite: https://www.valinor.co/
    securityAdminGuideUrl: https://www.valinor.co/newsroom/streamline-security-admin-guide
    includedInMinimumAssessmentScope: true
  - serviceName: Unstructured Platform
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: The Unstructured Platform is an enterprise-grade ETL solution that automatically transforms complex, unstructured data into clean, structured data for GenAI applications.
    dateAvailable: "2025-07-25"
    securityCategory: High
    providerWebsite: https://unstructured.io/
    securityAdminGuideUrl: https://docs.unstructured.io/welcome
    includedInMinimumAssessmentScope: true
  - serviceName: Valinor Harbor
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    serviceDescription: HarborOS is a secure, modular software platform designed to enable distributed medical operations and data management in austere or disconnected environments. It integrates infrastructure monitoring, patient tracking, and logistics coordination within a FedRAMP-compliant cloud architecture to support Harbor Box facilities.
    dateAvailable: "2025-12-19"
    securityCategory: High
    providerWebsite: https://www.valinor.co/
    securityAdminGuideUrl: https://www.valinor.co/newsroom/harborsecurity-admin-guide
    includedInMinimumAssessmentScope: true
certifiedServicesNote:
  rule: CDS-CSO-SVC
  dateAvailableBasis: Where shown, dateAvailable is the date an application entered the PFCS-SS authorization boundary, based on the System Security Plan version history. It is not a commercial general-availability date; original ship dates are not shown because they are not the dates relevant to this certification.
servicesOutsideMinimumAssessmentScope:
  - serviceName: Software delivered for installation on agency systems
    supplementalDocuments: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.0e46fd1b-8fad-4f11-9481-e7ef19abc0d9
    reason: Software that PFCS-SS delivers separately for installation on agency systems and does not operate in a shared-responsibility model is not a cloud service and is not included in the offering.
documentationOverview:
  - name: Public offering information
    rule: CDS-CSO-PUB
    formats:
      - Markdown
      - JSON
    availability: Public
    description: Public human-readable package information and machine-readable Marketplace JSON generated from the same source data in the public repository.
    url: https://github.com/palantir/palantir-fedramp-marketplace/blob/develop/generated/markdown/pfcs-ss-package.md
    machineReadableUrl: https://raw.githubusercontent.com/palantir/palantir-fedramp-marketplace/develop/generated/json/pfcs-ss-package.json
  - name: Secure Configuration Guidance
    rule: SCG-CSO-RSC
    formats:
      - Human-readable
    availability: Offering-specific index available to authorized parties through the PFCS Documentation Repository.
    url: https://pfcsdocs.palantirgov.com/workspace/compass/view/ri.compass.main.folder.f8620325-fdb5-4b5e-843a-b53ce10db2ba
    description: PFCS-SS Secure Configuration Guidance provides an offering-specific index of per-application Security Admin Guides.
  - name: PFCS-SS Certification Data
