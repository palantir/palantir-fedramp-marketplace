plugins:
  resolvers:
    - https://github.com/{{index GroupParts 1}}/{{index GroupParts 2}}/releases/download/v{{Version}}/{{Product}}-{{Version}}-{{OS}}-{{Arch}}.tgz
  plugins:
    - locator:
        id: com.palantir.godel-generate-plugin:generate-plugin:1.53.0
        checksums:
          darwin-amd64: c601aba00d16a06322c32274346e4014e20c58484618335cb6357682a59b9c99
          darwin-arm64: 8ba7b58987b434e7845ecfc2cc6383dce6a672aa75f0a6a5fd013ea32852c93b
          linux-amd64: fd8bd92c6f5f6db359b31ed48ccb39319195a61740256d4069b17d4c6546a1d6
          linux-arm64: dbb11d21d09efeabf3f53904dbc7691fbd8ca44ad03cf0f1a8288859b79a42af
environment:
  # Revalidate against the vendored schemas on every run, including in CI.
  GOFLAGS: -count=1 -v
exclude:
  names:
    - '\..+'
  paths:
    - godel
    - vendor
