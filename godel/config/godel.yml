plugins:
  resolvers:
    - https://github.com/{{index GroupParts 1}}/{{index GroupParts 2}}/releases/download/v{{Version}}/{{Product}}-{{Version}}-{{OS}}-{{Arch}}.tgz
  plugins:
    - locator:
        id: com.palantir.godel-generate-plugin:generate-plugin:1.52.0
        checksums:
          darwin-amd64: 6f2a4553f41458dc52671d7ba19604577f980e35e24248b692e6e3c43b981886
          darwin-arm64: d5e08050c1968accf64df6875de8a7a21818d5774e2cc602e765804f85a53487
          linux-amd64: 6b22d280035dc4d7324e833cbb240db1e747569923959f0c6e4d8fab27e3c438
          linux-arm64: 707359db7c3c1b859e123664aae35e3b100a406d0e821a17d6011baad88336a0
environment:
  # Revalidate against the vendored schemas on every run, including in CI.
  GOFLAGS: -count=1 -v
exclude:
  names:
    - '\..+'
  paths:
    - godel
    - vendor
